name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools Write,Bash
          prompt: |
            このPRをレビューしてください。

            レビューの観点と判定基準（PASS／FAIL）は、リポジトリ内の
            `docs/development-standards.md` の「4.3 CIによる自動コードレビュー」
            （4.3.1〜4.3.3）を正とし、それに従ってください。
            PRの差分（git diff）に加え、差分に関連するファイル（設計書・YAML・
            テストケース一覧・永続ドキュメント等）も必要に応じて読んで確認してください。

            レビュー内容はPRへのコメントとして投稿してください。コメントには、
            4.3.2の観点ごとに「問題なし」「指摘あり」「該当なし」のいずれかを明記し、
            指摘がある場合はその内容と、FAIL相当かどうかを書いてください。

            加えて、リポジトリのルートに `review_result.txt` というファイルを作成し、
            中身は以下のどちらか1行だけにしてください（他の文字は含めない）。
              REVIEW_RESULT: PASS
            または
              REVIEW_RESULT: FAIL

      - name: Check review result
        run: |
          if [ ! -f review_result.txt ]; then
            echo "review_result.txt が見つかりません。レビューが正常に完了しなかった可能性があります。"
            exit 1
          fi
          cat review_result.txt
          if grep -q "REVIEW_RESULT: FAIL" review_result.txt; then
            echo "レビューでFAIL判定が出たため、このジョブを失敗させます。"
            exit 1
          fi
          echo "レビューはPASSでした。"
