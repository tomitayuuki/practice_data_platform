name: anthropic-wif-test
on: pull_request
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01XeZVx4thbTkRbcoA6LXsPh",
            "organization_id": "c6bf7aa1-6ced-4c3d-a830-6a6177be009a",
            "service_account_id": "svac_01Njwe6rge6DodNmYSYCSfz8",
            "workspace_id": "wrkspc_018r68Swz8YGsDzmbfbhrsbU"
          }
          JSON
